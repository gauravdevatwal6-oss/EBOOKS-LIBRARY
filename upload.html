<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Media - Gaurav Dev</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background: #f8f9ff;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .preview {
            margin-top: 20px;
            text-align: center;
        }
        
        .preview img, .preview video {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        .copy-btn {
            background: #28a745;
        }
        
        .url-display {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
        }
        
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .nav-buttons {
            margin-bottom: 20px;
            text-align: center;
        }
        
        .nav-btn {
            background: #6c757d;
            text-decoration: none;
            display: inline-block;
            padding: 8px 15px;
            color: white;
            border-radius: 5px;
            margin: 0 5px;
        }
        
        .nav-btn:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-buttons">
            <a href="/" class="nav-btn">🏠 Home</a>
            <a href="/gallery.html" class="nav-btn">📷 Gallery</a>
        </div>
        
        <h1>📤 Upload Image or Video</h1>
        <p class="subtitle">Click or drag & drop to upload. Max 20MB per file.</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📸</div>
            <p>Click to select or drag & drop</p>
            <p style="font-size: 12px; color: #999; margin-top: 10px;">
                Supported: JPG, PNG, GIF, WebP, MP4, MOV
            </p>
            <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;">
        </div>
        
        <div id="preview" class="preview"></div>
        <div id="message"></div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewDiv = document.getElementById('preview');
        const messageDiv = document.getElementById('message');
        
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#764ba2';
            uploadArea.style.background = '#f8f9ff';
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#667eea';
            uploadArea.style.background = 'white';
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#667eea';
            uploadArea.style.background = 'white';
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });
        
        async function handleFile(file) {
            if (file.size > 20 * 1024 * 1024) {
                showMessage('File too large! Max 20MB allowed.', 'error');
                return;
            }
            
            if (!file.type.startsWith('image/') && !file.type.startsWith('video/')) {
                showMessage('Please upload an image or video file.', 'error');
                return;
            }
            
            const previewUrl = URL.createObjectURL(file);
            if (file.type.startsWith('image/')) {
                previewDiv.innerHTML = `<img src="${previewUrl}" alt="Preview">`;
            } else {
                previewDiv.innerHTML = `<video controls src="${previewUrl}"></video>`;
            }
            
            await uploadFile(file);
        }
        
        async function uploadFile(file) {
            showMessage('<span class="loader"></span> Uploading...', 'success');
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    headers: {
                        'Content-Type': file.type,
                    },
                    body: arrayBuffer,
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage(`
                        ✅ <strong>Upload Successful!</strong><br>
                        <div class="url-display">${data.url}</div>
                        <button onclick="copyToClipboard('${data.url}')" class="copy-btn">📋 Copy URL</button>
                        <button onclick="saveToGallery('${data.url}', '${file.name}')" style="background: #28a745; margin-left: 10px;">💾 Save to Gallery</button>
                    `, 'success');
                    
                    if (file.type.startsWith('image/')) {
                        previewDiv.innerHTML = `<img src="${data.url}" alt="Uploaded">`;
                    } else {
                        previewDiv.innerHTML = `<video controls src="${data.url}"></video>`;
                    }
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                console.error('Upload error:', error);
                showMessage('Upload failed: ' + error.message, 'error');
            }
        }
        
        function showMessage(html, type) {
            messageDiv.innerHTML = `<div class="${type}">${html}</div>`;
        }
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            showMessage('📋 URL copied to clipboard!', 'success');
            setTimeout(() => {
                if (messageDiv.innerHTML.includes('copied')) {
                    messageDiv.innerHTML = '';
                }
            }, 2000);
        }
        
        function saveToGallery(url, filename) {
            let gallery = JSON.parse(localStorage.getItem('mediaGallery') || '[]');
            gallery.unshift({
                url: url,
                filename: filename,
                date: new Date().toISOString()
            });
            gallery = gallery.slice(0, 50);
            localStorage.setItem('mediaGallery', JSON.stringify(gallery));
            showMessage('💾 Saved to gallery! View in <a href="/gallery.html" style="color: #155724;">Gallery</a>', 'success');
        }
    </script>
</body>
</html>
