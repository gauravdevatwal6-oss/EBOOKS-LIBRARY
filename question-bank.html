<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question Bank</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(to bottom, #000000, #1a1a1a);
    color: white;
}

/* Title */
h2 {
    text-align: center;
    margin: 20px;
}

/* Grid Layout */
.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    padding: 15px;
}

/* Card */
.card {
    height: 140px;
    border-radius: 15px;
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: end;
    justify-content: center;
    padding: 10px;
    position: relative;
    overflow: hidden;
}

/* Dark overlay */
.card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
}

.card h4 {
    position: relative;
    z-index: 1;
    font-size: 13px;
}

/* Different images */
.vmc {
    background-image: url("images/vmc.jpg");
}

.unacademy {
    background-image: url("images/unacademy.jpg");
}

.esaral {
    background-image: url("images/esaral.jpg");
}

/* Scroll to top button */
.top-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: black;
    color: white;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255,255,255,0.2);
}

/* Mobile */
@media(max-width: 768px){
    .grid {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<h2>📚 Question Bank</h2>

<div class="grid">

<div class="card vmc">
    <h4>VMC Modules</h4>
</div>

<div class="card unacademy">
    <h4>Unacademy Modules</h4>
</div>

<div class="card esaral">
    <h4>Esaral Modules</h4>
</div>

<!-- aur add karna ho toh copy paste karo -->

</div>

<!-- Scroll Button -->
<div class="top-btn" onclick="topFunction()">⬆</div>

<script>
function topFunction() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>

</body>
</html>
